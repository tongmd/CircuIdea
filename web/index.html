<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafbfe"><title>CircuIdea</title><meta name="description" content="记下想法，继续推进。"><link rel="icon" href="/assets/favicon.ico"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="stylesheet" href="/style.css?v=simple-20261025"><script type="module" src="/app.js"></script></head><body><header><a class="brand" href="/"><img src="/assets/favicon-96x96.png" width="28" height="28" alt="">CircuIdea</a><span id="save-state" role="status">保存在此浏览器</span></header><main><form id="capture"><label for="thought">有什么新想法？</label><textarea id="thought" rows="3" maxlength="50000" placeholder="直接写下来…" required></textarea><div class="capture-bottom"><button type="submit">记下</button></div></form><section id="ideas" aria-label="想法"><input id="search" type="search" aria-label="查找想法" placeholder="查找想法" hidden><div id="idea-list"></div></section><section id="editor" hidden aria-label="编辑想法"><div class="editor-actions"><button id="back" class="quiet" type="button">← 所有想法</button><button id="toggle-status" class="quiet" type="button">完成</button></div><input id="idea-title" aria-label="想法标题" maxlength="160"><p id="summary" hidden></p><textarea id="idea-body" aria-label="想法正文" placeholder="接着想，接着写…" maxlength="50000"></textarea><div id="existing-records"></div><button id="send-shui" type="button" class="quiet">送到 Shui!</button><p id="transfer-state" role="status"></p></section><p id="error" role="alert" hidden></p><noscript>请启用 JavaScript。</noscript></main></body></html>
